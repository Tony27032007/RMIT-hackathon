<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Completing login...</title>
</head>
<body>
  <p id="status">Completing login...</p>
  <script type="module">
    import { IAMService } from "@tidecloak/js";

    const iam = IAMService;
    const status = document.getElementById("status");

    try {
      const [adapterResponse, apiResponse] = await Promise.all([
        fetch("/tidecloak.json", { cache: "no-store" }),
        fetch("/api/config", { cache: "no-store" }),
      ]);
      if (!adapterResponse.ok) throw new Error("TideCloak adapter could not be loaded.");
      if (!apiResponse.ok) throw new Error("HomeLock API configuration could not be loaded.");
      const apiConfig = await apiResponse.json();
      if (!apiConfig.authConfigured) {
        throw new Error(apiConfig.authIssue || "Server-side TideCloak verification is not configured.");
      }
      const config = await adapterResponse.json();
      iam.on("initError", (_event, error) => {
        status.textContent = `Authentication initialization failed: ${error?.message || "unknown error"}`;
      });
      iam.on("authError", (_event, error) => {
        status.textContent = `Authentication failed: ${error?.message || "please try again"}`;
      });
      iam.on("tokenExpired", () => {
        status.textContent = "Your TideCloak session expired. Return to HomeLock and sign in again.";
      });
      await iam.initIAM({
        ...config,
        redirectUri: `${window.location.origin}/auth/redirect`,
        silentCheckSsoRedirectUri: `${window.location.origin}/silent-check-sso.html`,
        useDPoP: { mode: "strict", alg: "ES256" },
      });

      if (iam.isLoggedIn()) {
        status.textContent = "Redirecting...";
        window.location.assign("/");
      } else {
        status.textContent = "Login was not completed. Return to HomeLock and try again.";
        setTimeout(() => window.location.assign("/"), 3000);
      }
    } catch (err) {
      status.textContent = `Authentication error: ${err.message}`;
      setTimeout(() => window.location.assign("/"), 3000);
    }
  </script>
</body>
</html>
