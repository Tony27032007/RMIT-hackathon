<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome home — HomeLock</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="callback">
      <div id="callback-panel" class="panel">
        <span class="brand">
          <span class="brand-mark callback-mark" aria-hidden="true">H</span>
          <span>HomeLock</span>
        </span>
        <p id="callback-eyebrow" class="eyebrow" hidden>YOUR HOUSEHOLD SPACE</p>
        <h1 id="welcome-title" class="callback-title" hidden>Welcome home.</h1>
        <p id="welcome-copy" class="subtle callback-copy" hidden>
          Your household archive is ready.
        </p>
        <div id="welcome-progress" class="callback-progress" aria-hidden="true" hidden>
          <span></span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">
          Completing login…
        </p>
      </div>
    </main>
    <script type="module">
      import { IAMService } from "@tidecloak/js";

      const iam = IAMService;
      const status = document.getElementById("status");
      const callbackPanel = document.getElementById("callback-panel");
      const welcomeElements = [
        document.getElementById("callback-eyebrow"),
        document.getElementById("welcome-title"),
        document.getElementById("welcome-copy"),
        document.getElementById("welcome-progress"),
      ];
      const showError = (message) => {
        status.textContent = message;
        status.dataset.state = "error";
      };

      try {
        const [adapterResponse, apiResponse] = await Promise.all([
          fetch("/tidecloak.json", { cache: "no-store" }),
          fetch("/api/config", { cache: "no-store" }),
        ]);
        if (!adapterResponse.ok)
          throw new Error("The TideCloak adapter could not be loaded.");
        if (!apiResponse.ok)
          throw new Error(
            "The HomeLock API configuration could not be loaded.",
          );
        const apiConfig = await apiResponse.json();
        if (!apiConfig.authConfigured) {
          throw new Error(
            apiConfig.authIssue ||
              "Server-side TideCloak verification is not configured.",
          );
        }
        const config = await adapterResponse.json();
        iam.on("initError", (_event, error) => {
          showError(
            `TideCloak initialization failed: ${error?.message || "unknown error."}`,
          );
        });
        iam.on("authError", (_event, error) => {
          showError(`Sign-in failed: ${error?.message || "please try again."}`);
        });
        iam.on("tokenExpired", () => {
          showError(
            "Your TideCloak session expired. Return to HomeLock and sign in again.",
          );
        });
        await iam.initIAM({
          ...config,
          redirectUri: `${window.location.origin}/auth/redirect`,
          silentCheckSsoRedirectUri: `${window.location.origin}/silent-check-sso.html`,
          useDPoP: { mode: "strict", alg: "ES256" },
        });

        if (iam.isLoggedIn()) {
          callbackPanel.classList.add("callback-welcome");
          welcomeElements.forEach((element) => {
            element.hidden = false;
          });
          status.textContent = "Taking you to your home…";
          status.dataset.state = "ready";
          const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ? 500
            : 1800;
          setTimeout(() => window.location.assign("/"), delay);
        } else {
          showError("Sign-in was not completed. Returning to HomeLock…");
          setTimeout(() => window.location.assign("/"), 3000);
        }
      } catch (err) {
        showError(`Sign-in error: ${err.message} Returning to HomeLock…`);
        setTimeout(() => window.location.assign("/"), 3000);
      }
    </script>
  </body>
</html>
